name: watchdog
on:
  schedule:
    - cron: "2-59/5 * * * *" # every 5 min, offset off the top of the hour (GitHub delays/drops cron at :00); each job watches for 4 (no backlog, near-continuous coverage)
  workflow_dispatch:
    inputs:
      simulate_stale_minutes:
        description: "Force the alert path (circuit test); 0 = real watch"
        required: false
        default: "0"
        type: string
concurrency:
  group: watchdog
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install Nushell (latest stable — the check script is stable-compatible)
        uses: hustcer/setup-nu@v3
      - name: Watch
        env:
          WATCHDOG_BOT_TOKEN: ${{ secrets.WATCHDOG_BOT_TOKEN }}
          WATCHDOG_CHAT_ID: ${{ secrets.WATCHDOG_CHAT_ID }}
        run: nu watchdog-check.nu --loop-seconds 240 --simulate-stale-minutes ${{ inputs.simulate_stale_minutes || '0' }}
