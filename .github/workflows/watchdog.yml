name: watchdog
on:
  # Manual-only since 31/10. GitHub's scheduler degraded to one run every
  # 3-6 h (measured), so it cannot be the detector. The primary dead man's
  # switch is healthchecks.io: the Mac pings it every 60 s, and the service
  # sends the Telegram alert when the pings stop. Keep this workflow for
  # circuit tests and for reading the diagnostic gist on demand.
  workflow_dispatch:
    inputs:
      simulate_stale_minutes:
        description: "Force the alert path (circuit test); 0 = real watch"
        required: false
        default: "0"
        type: string
concurrency:
  group: watchdog
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install Nushell (latest stable — the check script is stable-compatible)
        uses: hustcer/setup-nu@v3
      - name: Watch
        env:
          WATCHDOG_BOT_TOKEN: ${{ secrets.WATCHDOG_BOT_TOKEN }}
          WATCHDOG_CHAT_ID: ${{ secrets.WATCHDOG_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: nu watchdog-check.nu --loop-seconds 240 --simulate-stale-minutes ${{ inputs.simulate_stale_minutes || '0' }}
